<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popoe clicker</title>
    <link rel="icon" type="image/ico" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="head-panel">
        <div class="global-counter-container">
            <span class="global-counter-label">Всего кликов в мире:</span>
            <span id="global-counter">Загрузка...</span>
        </div>

        <!-- <div class="controls">
            <button id="action-btn">Кликни меня!</button>
        </div> -->
    </div>

    <!-- Контейнер для картинки, прижатой к низу -->
    <div class="bottom-image-container">
        <button id="action-btn">
            <img id="target-img" src="media/pic1.png" alt="Динамическое изображение">
        </button>
    </div>

    <script src="script.js"></script>

</body>
</html>
