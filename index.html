<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивный сайт</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preload" href="pic2.png" as="image">
    <link rel="preload" href="image.png" as="image">
    <link rel="preload" href="brr.jpg" as="image">
</head>
<body>

    <div class="controls">
        <p class="counter-label">Всего нажатий</p>
        <p id="global-count" aria-label="Общее количество нажатий">—</p>
        <p class="image-hint">Нажми на картинку</p>
        <p id="counter-status" role="status" aria-live="polite">Подключаем общий счётчик…</p>
        <p id="playback-status" role="status" aria-live="polite">Загружаем изображения…</p>
    </div>

    <!-- Контейнер для картинки, прижатой к низу -->
    <div class="bottom-image-container">
        <img id="target-img" src="pic1.png" alt="Первый кадр анимации" width="768" height="1024" role="button" tabindex="0" aria-label="Нажать на картинку: воспроизвести звук и увеличить общий счётчик" aria-disabled="true" draggable="false">
    </div>

    <script src="script.js"></script>
</body>
</html>
